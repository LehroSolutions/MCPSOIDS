name: MCPSOIDS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: bun install
      - run: bun run lint
      - run: bun run build
      - run: bun run format:check
      - run: bun run docs:check
