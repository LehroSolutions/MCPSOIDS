name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp_server_ref/package-lock.json

      - name: Install
        working-directory: mcp_server_ref
        run: npm ci

      - name: Lint
        working-directory: mcp_server_ref
        run: npm run lint

      - name: Build
        working-directory: mcp_server_ref
        run: npm run build

      - name: Start server
        working-directory: mcp_server_ref
        run: |
          MCP_AUTH_TOKEN=ci-token MCP_AUDIT_LOG_PATH=data/audit/ci-audit.jsonl node bin/mcp-server-ref.js --host 127.0.0.1 --port 3000 --enable-fs --root . &
          echo $! > server.pid

      - name: Wait for health
        run: |
          for i in {1..40}; do
            if curl -sf -H "Authorization: Bearer ci-token" http://127.0.0.1:3000/.well-known/mcp-health > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          echo "Server did not become healthy in time"
          exit 1

      - name: Inspector
        working-directory: mcp_server_ref
        env:
          MCP_AUTH_TOKEN: ci-token
        run: npm run inspector

      - name: Stop server
        if: always()
        working-directory: mcp_server_ref
        run: |
          kill $(cat server.pid) || true

  control-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Control Center checkout
        id: control_center
        run: |
          if [ -f mcp-control-center/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Control Center checks because mcp-control-center is a gitlink without a checked-out nested repository."
          fi

      - uses: actions/setup-node@v4
        if: steps.control_center.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-control-center/package-lock.json

      - name: Install
        if: steps.control_center.outputs.present == 'true'
        working-directory: mcp-control-center
        run: npm ci

      - name: Install server dependencies for E2E
        if: steps.control_center.outputs.present == 'true'
        working-directory: mcp_server_ref
        run: npm ci

      - name: Lint
        if: steps.control_center.outputs.present == 'true'
        working-directory: mcp-control-center
        run: npm run lint

      - name: Build
        if: steps.control_center.outputs.present == 'true'
        working-directory: mcp-control-center
        env:
          MCP_SERVER_URL: http://127.0.0.1:3000
          MCPSOIDS_UI_SECRET: ci-ui-secret
          MCPSOIDS_ADMIN_TOKEN: ci-admin-token
        run: npm run build

      - name: Install Playwright
        if: steps.control_center.outputs.present == 'true'
        working-directory: mcp-control-center
        run: npx playwright install --with-deps chromium

      - name: E2E
        if: steps.control_center.outputs.present == 'true'
        working-directory: mcp-control-center
        run: npm run test:e2e

