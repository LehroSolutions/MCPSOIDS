<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCPSOIDS Control Center</title><style>:root{font:15px/1.5 Arial;background:#080b0d;color:#f4f7f8;--p:#49d6c8;--line:#29343b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#12302f,transparent 35rem),#080b0d;min-height:100dvh}.shell{max-width:1380px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}h1{margin:0;font-size:19px;letter-spacing:.07em}.muted{color:#91a0a8}.status{border:1px solid var(--line);padding:8px 12px;border-radius:999px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin-top:18px;border:1px solid var(--line)}.metric{background:#101519;padding:18px}.metric strong{display:block;font-size:28px;margin-top:8px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-top:18px}.panel{background:#101519;border:1px solid var(--line);border-radius:10px;padding:18px}.chart{height:170px;display:flex;gap:6px;align-items:end}.bar{flex:1;background:linear-gradient(var(--p),#216d67);min-height:5px}.tools{display:grid;gap:10px}.tool{padding:13px;background:#151c21;border:1px solid var(--line);border-radius:8px}.tool code{color:var(--p)}input,select,button,pre{font:inherit}input,select{background:#070a0c;color:white;border:1px solid var(--line);padding:11px;border-radius:8px}button{min-height:44px;background:var(--p);border:0;border-radius:8px;font-weight:800;padding:0 18px}.runner{display:grid;grid-template-columns:140px 1fr auto;gap:10px}pre{white-space:pre-wrap;max-height:260px;overflow:auto;background:#06090b;padding:14px;border:1px solid var(--line);border-radius:8px}.eyebrow{font:700 11px Consolas;letter-spacing:.12em;text-transform:uppercase;color:#91a0a8}@media(max-width:850px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.runner{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="shell"><header><div><div class="eyebrow">Active robustness observatory</div><h1>MCPSOIDS Control Center</h1></div><div id="status" class="status">Connecting</div></header><section class="metrics"><div class="metric"><span class="eyebrow">Health</span><strong id="health">--</strong></div><div class="metric"><span class="eyebrow">Requests</span><strong id="active">0</strong></div><div class="metric"><span class="eyebrow">Memory</span><strong id="memory">--</strong></div><div class="metric"><span class="eyebrow">Janitor</span><strong id="janitor">Watch</strong></div></section><div class="grid"><section><article class="panel"><div class="eyebrow">Heartbeat / last 30 polls</div><div id="chart" class="chart"></div></article><article class="panel" style="margin-top:18px"><div class="eyebrow">Roots security laboratory</div><form id="runner" class="runner" style="margin-top:14px"><select id="tool"><option>fs/ls</option><option>fs/read_file</option></select><input id="path" value="." aria-label="Path"><button>Execute</button></form><pre id="out">Try ../ to observe the Roots validator reject traversal.</pre></article></section><aside class="panel"><div class="eyebrow">Capability catalog</div><div id="tools" class="tools" style="margin-top:14px"><div class="tool">Loading…</div></div></aside></div></main><script>const $=x=>document.getElementById(x),hist=[];async function health(){try{const d=await fetch('/.well-known/mcp-health').then(r=>r.json()),s=(d.status||'green').toLowerCase();$('health').textContent=s.toUpperCase();$('active').textContent=d.activeRequests??0;$('memory').textContent=d.memory?.heapUsed?`${(d.memory.heapUsed/1048576).toFixed(1)} MB`:'OK';$('janitor').textContent=s==='red'?'Intervene':s==='yellow'?'Observe':'Clear';$('status').textContent=`Runtime ${s}`;hist.push(s==='green'?82:s==='yellow'?45:15);if(hist.length>30)hist.shift();$('chart').innerHTML=hist.map(h=>`<i class="bar" style="height:${h}%"></i>`).join('')}catch{$('status').textContent='Offline'}}async function catalog(){try{const d=await fetch('/.well-known/mcp-configuration').then(r=>r.json());$('tools').innerHTML=Object.values(d.capabilities?.tools||{}).map(t=>`<div class="tool"><code>${t.name}</code><div class="muted">${t.description}</div></div>`).join('')}catch{}}$('runner').onsubmit=async e=>{e.preventDefault();const name=$('tool').value,args={path:$('path').value};if(name==='fs/read_file')args.max_bytes=65536;const d=await fetch('/mcp',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:'ui',method:'tools/call',params:{name,arguments:args}})}).then(r=>r.json()).catch(String);$('out').textContent=JSON.stringify(d,null,2)};health();catalog();setInterval(health,3000)</script></body></html>
